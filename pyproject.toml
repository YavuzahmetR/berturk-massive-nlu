[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-nlu"
version = "0.1.0"
description = "Turkish Joint NLU: intent classification + slot filling with BERTurk"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*", "scripts*", "api*", "tests*"]