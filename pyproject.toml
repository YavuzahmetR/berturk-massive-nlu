[project]
name = "turkish-nlu"
version = "0.1.0"
description = "Turkish Joint NLU: intent classification + slot filling with BERTurk"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3.0",
    "seqeval>=1.2.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "optuna>=3.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "requests>=2.31.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "scripts*", "api*", "tests*"]